<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>View camera stream</title>
  <style>
    body { font-family: Segoe UI, sans-serif; margin: 24px; max-width: 720px; }
    label { display: block; margin: 8px 0 4px; }
    input, button { padding: 6px 8px; }
    input { width: 100%; box-sizing: border-box; }
    video { width: 100%; background: #111; min-height: 240px; margin-top: 12px; }
    #log { white-space: pre-wrap; background: #f4f4f4; padding: 8px; height: 120px; overflow: auto; }
    button { margin: 12px 8px 0 0; }
    .hint { color: #555; font-size: 13px; }
  </style>
</head>
<body>
  <h1>View stream</h1>
  <p class="hint">Open this on your system. Remote PC uses camera-publish.html with the same device id. Multiple viewers are supported.</p>
  <label>API URL</label>
  <input id="apiUrl" placeholder="https://localhost:7170" />
  <label>Device id</label>
  <input id="deviceId" type="number" />
  <label>Camera index</label>
  <input id="cameraIndex" type="number" value="0" />
  <label>TURN URL (optional, same as publisher if used)</label>
  <input id="turnUrl" placeholder="turn:turn.example.com:3478" />
  <label>TURN username</label>
  <input id="turnUser" />
  <label>TURN password</label>
  <input id="turnPass" type="password" />
  <button id="start">Show stream</button>
  <button id="stop">Stop</button>
  <video id="video" autoplay playsinline></video>
  <div id="log"></div>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script src="camera-stream.js"></script>
  <script>
    document.getElementById("apiUrl").value = location.origin;
    const video = document.getElementById("video");
    let connection, form, peer;

    function closePeer() {
      peer?.close();
      peer = null;
      video.srcObject = null;
    }

    const handlers = {
      PublisherJoined: () => connection.invoke("RequestOffer", form.deviceId, form.cameraIndex),
      PublisherLeft: closePeer,
      CameraSignal: async (message) => {
        const payload = message.payload;
        if (!payload || !peer) return;
        if (payload.type === "offer") {
          await peer.setRemoteDescription({ type: "offer", sdp: payload.sdp });
          const answer = await peer.createAnswer();
          await peer.setLocalDescription(answer);
          await signal(connection, form, connection.connectionId, { type: "answer", sdp: answer.sdp });
        } else if (payload.type === "ice" && payload.candidate) {
          await peer.addIceCandidate(payload.candidate);
        }
      }
    };

    document.getElementById("start").onclick = async () => {
      try {
        closePeer();
        peer = new RTCPeerConnection({ iceServers: iceServers() });
        peer.ontrack = (e) => { video.srcObject = e.streams[0]; };
        peer.onicecandidate = (e) => {
          if (e.candidate && connection) signal(connection, form, connection.connectionId, { type: "ice", candidate: e.candidate });
        };
        ({ connection, form } = await connect("viewer", handlers, connection));
        log("Waiting for offer");
      } catch (e) {
        log(e.message || String(e));
      }
    };

    document.getElementById("stop").onclick = async () => {
      await stop(connection, form, closePeer);
      log("Stopped");
    };
  </script>
</body>
</html>
